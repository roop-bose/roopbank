name: RoopBank CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    env:
      DB_USERNAME: roopbank
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Start MySQL and Kafka
        run: docker compose up -d mysql kafka

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            if docker compose exec -T mysql \
              mysqladmin ping -h localhost -uroot -p"$MYSQL_ROOT_PASSWORD" --silent; then
              echo "MySQL is ready"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Wait for Kafka
        run: |
          for i in {1..30}; do
            if docker compose exec -T kafka \
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              echo "Kafka is ready"
              break
            fi
            echo "Waiting for Kafka..."
            sleep 2
          done

      - name: Run tests
        run: bash ./mvnw test